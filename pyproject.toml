[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xyz-employee-portal"
version = "1.0.0"
description = "Role-based XYZ employee portal with a handbook RAG assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.67,<2",
    "pypdf>=6.17,<7",
    "numpy>=2.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "sentence-transformers>=5.0",
    "langsmith>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "app_pages", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["xyz_portal"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
